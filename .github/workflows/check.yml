name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
          cache: true
      - run: pnpm check
      - run: node scripts/scene-smoke.ts > /dev/null
      - run: pnpm build > /dev/null
